<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crank — panel demo</title>
  <style>
    :root {
      --ink: #1a1a1a;
      --muted: #555;
      --accent: #0f766e;
      --bg: #f4f6f5;
    }
    body {
      margin: 0;
      font: 16px/1.5 ui-sans-serif, system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, #d9eee9 0%, transparent 45%),
        radial-gradient(circle at 90% 10%, #e8eef2 0%, transparent 40%),
        var(--bg);
      min-height: 100vh;
    }
    main {
      max-width: 42rem;
      margin: 0 auto;
      padding: 3rem 1.25rem;
    }
    .card {
      background: #fff;
      border: 1px solid #d8d8d8;
      border-radius: 12px;
      padding: 1.5rem;
    }
    h1 { margin: 0 0 0.5rem; font-size: 1.75rem; }
    p { margin: 0 0 1rem; color: var(--muted); }
    button {
      border: 0;
      background: var(--accent);
      color: #fff;
      padding: 0.55rem 0.95rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .hint { font-size: 0.9rem; margin-top: 1.25rem; }
    code { background: #eee; padding: 0.1em 0.35em; border-radius: 4px; }
  </style>
</head>
<body>
  <main>
    <div id="hero" class="card">
      <h1>Utilize our robust platform today</h1>
      <p>Seamless fleet insights for every operator.</p>
      <button type="button">Get started</button>
    </div>
    <p class="hint">
      <strong>Get started</strong> is demo copy only — it does not open Crank. Click the floating
      <strong>Crank</strong> button (bottom-right), then click this card. Setup: <a href="/setup">/setup</a>
    </p>
  </main>
  <script>
    window.__CRANK_COMPANION__ = location.origin.replace(/\/$/, '');
    window.addEventListener('pageshow', function (ev) {
      if (ev.persisted && !document.getElementById('vp-shell') && !document.getElementById('vp-crank-reopen')) {
        window.__CRANK_LOADER__ = false;
        window.__crankTeardown = null;
        var s = document.createElement('script');
        s.src = '/bookmarklet.js?t=' + Date.now();
        document.documentElement.appendChild(s);
      }
    });
  </script>
  <script src="/bookmarklet.js"></script>
</body>
</html>
